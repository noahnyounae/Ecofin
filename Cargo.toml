# Workspace en trois couches :
#
#   core → modèle, persistance, fournisseurs, import, analyse — sans interface
#   cli  → la ligne de commande
#   web  → le serveur HTTP et l'application web
#
# `core` ignore tout de ses consommateurs : catégorisation et portefeuilles
# virtuels s'y ajouteront comme modules, et seront immédiatement disponibles
# des deux côtés.

[workspace]
members = ["crates/core", "crates/cli", "crates/web"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Versions décidées ici une fois pour toutes : deux crates ne peuvent pas
# diverger sur une dépendance partagée.
[workspace.dependencies]
ecofin-core = { path = "crates/core" }

anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
rust_decimal = { version = "1.42.1", features = ["serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
toml = "1.1.4"
uuid = { version = "1.26.0", features = ["v4"] }
